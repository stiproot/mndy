default: true

# Prose docs wrap for readability, not to a hard column. 250 is a runaway guard,
# not a style rule — matches the house style used across the sibling plugin repos.
MD013:
  line_length: 250

MD046:
  style: fenced

# Repeating a subheading under a DIFFERENT parent is normal in reference docs — several
# sections each having "Protocol Messages" or "Error Handling" is a feature, not drift.
# Repeating one under the SAME parent still fails.
MD024:
  siblings_only: true

MD007:
  indent: 2
