[project]
name = "mndy"
version = "0.1.0"
description = "Project analytics platform for Azure DevOps"
requires-python = ">=3.12"

[tool.uv.workspace]
# Globs, matching the bun side — a new Python worker joins the workspace by existing,
# rather than by someone remembering to add it here. `apps/*` cannot be used: uv errors on
# a matched directory with no pyproject.toml, and most apps/ entries are TypeScript.
members = [
    "apps/*-worker",
    "packages/py/*",
]
